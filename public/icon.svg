<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="facetGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Inner glowing facet halo -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="32" filter="blur(20px)" />

  <!-- Master Gemstone Geometric Facets (Safe Zone) -->
  <g transform="translate(256, 256) scale(1.15) translate(-256, -256)">
    <!-- Crown Table -->
    <polygon points="186,170 326,170 380,230 132,230" fill="url(#facetGrad1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Left Star Facet -->
    <polygon points="132,230 186,170 256,170 200,230" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Right Star Facet -->
    <polygon points="380,230 326,170 256,170 312,230" fill="#2563eb" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Center Table Reflection -->
    <polygon points="200,230 256,170 312,230 256,230" fill="#e0f2fe" fill-opacity="0.4" stroke="#7dd3fc" stroke-width="2" stroke-linejoin="round" />

    <!-- Pavilion Center Cone -->
    <polygon points="132,230 380,230 256,365" fill="url(#gemGrad)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />

    <!-- Left Lower Pavilion Facet -->
    <polygon points="132,230 215,280 256,365" fill="#1e3a8a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />

    <!-- Right Lower Pavilion Facet -->
    <polygon points="380,230 297,280 256,365" fill="#1d4ed8" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />

    <!-- Center Culet Facet -->
    <polygon points="215,280 297,280 256,365" fill="url(#facetGrad2)" stroke="#93c5fd" stroke-width="2" stroke-linejoin="round" />

    <!-- Highlight Sparkle Stars -->
    <polygon points="175,185 180,195 190,197 181,202 183,212 175,205 167,212 169,202 160,197 170,195" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
